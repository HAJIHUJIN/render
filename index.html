<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Nexus Cloud Services & API Gateway</title>
    <style>
        body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; background-color: #0f172a; color: #f8fafc; display: flex; justify-content: center; align-items: center; min-height: 100vh; margin: 0; }
        .card { background-color: #1e293b; padding: 2.5rem; border-radius: 12px; box-shadow: 0 10px 25px rgba(0,0,0,0.3); max-width: 480px; width: 100%; text-align: center; border: 1px solid #334155; }
        .status { display: inline-block; width: 10px; height: 10px; background-color: #10b981; border-radius: 50%; margin-right: 8px; }
        h1 { font-size: 1.5rem; margin-bottom: 0.5rem; color: #38bdf8; }
        p { color: #94a3b8; font-size: 0.95rem; line-height: 1.5; }
        .badge { background: #0284c7; color: white; padding: 4px 12px; border-radius: 20px; font-size: 0.8rem; font-weight: bold; }
    </style>
</head>
<body>
    <div class="card">
        <span class="badge">API Gateway v2.4</span>
        <h1>Nexus Cloud Gateway</h1>
        <p><span class="status"></span> All Cloud Services Operational</p>
        <hr style="border: 0; border-top: 1px solid #334155; margin: 1.5rem 0;">
        <p style="font-size: 0.85rem; color: #64748b;">Managed Node Endpoint for Microservices & Static Assets Processing.</p>
    </div>
</body>
</html>
